# Plugin developed by zImpoo [Telegram: @tentava | Discord: Impopite]

prefix: "<#00B4EE>ɢᴜᴀʀᴅɪᴀɴ <#3C3C3C>» "

vars:
  normal: "<#9A9A9A>"
  error: "<#CE0000>"
  success: "<#06BB00>"

message:
  no-permission: "<error>You don't have enough permissions!"
  console-cant-do-command: "<error>Only players can execute this command"
  player-not-found: "<error>Player not found."
  update-available: "<success>A new version is available! (<latest_version>) - <normal>https://modrinth.com/plugin/guardian"
  use-help: "<normal>Use <white>/guardian help<normal> to see available commands."

inspect:
  no-interaction: "<error>No interactions with this block."
  not-valid: "<error>Interact with a block or container to view logs."
  enabled: "<success>Inspect enabled."
  disabled: "<error>Inspect disabled."

command-usage:
  inspect: "<normal>/guardian inspect - Toggle inspect mode."
  rollback: "<normal>/guardian rollback <blocks|containers> <radius> <time> - Rollback changes."
  reload: "<normal>/guardian reload - Reload the configuration."
  lookup: "<normal>/guardian lookup <player> - View a player's logs."
  stats: "<normal>/guardian stats <player> - Player statistics."

rollback:
  invalid-time: "<error>Invalid time. Use formats like <white>15m<error>, <white>2h<error>, <white>1d<error> or <white>1h30m<error>."
  no-blocks: "<error>No block changes to undo in the selected radius."
  no-containers: "<error>No container movements to undo in the selected radius."
  blocks-success: "<success>Reverted <white><applied> <success>changes out of <white><total> <success>logs found."
  blocks-success-skipped: "<success>Reverted <white><applied> <success>changes. <white><skipped> <success>logs were skipped."
  containers-success: "<success>Reverted <white><applied> <success>movements out of <white><total> <success>logs found."
  containers-success-skipped: "<success>Reverted <white><applied> <success>movements. <white><skipped> <success>logs were skipped."
  containers-success-partial: "<success>Reverted <white><applied> <success>movements. <white><partial> <success>partial restores."
  containers-success-all: "<success>Reverted <white><applied> <success>movements. <white><skipped> <success>logs skipped and <white><partial> <success>partial restores."

reload:
  success: "<success>Configuration reloaded successfully."

lookup:
  no-logs: "<error>No logs found for this player."
  header: "<normal>Logs for <white><player><normal>:"

stats:
  no-logs: "<error>No logs found for this player."
  header: "<normal>Statistics for <white><player><normal>:"
  blocks: " <normal>Blocks: <white><count>"
  containers: " <normal>Containers: <white><count>"
  items: " <normal>Items: <white><count>"
  interacts: " <normal>Interactions: <white><count>"
  first-seen: " <normal>First activity: <white><date>"
  last-seen: " <normal>Last activity: <white><date>"

help:
  show: "Show this help message"
  inspect: "Toggle inspect mode"
  rollback: "Rollback changes in a radius"
  lookup: "View a player's logs"
  stats: "View player statistics"
  reload: "Reload the configuration"
