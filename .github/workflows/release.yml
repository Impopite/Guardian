name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jars
        run: |
          chmod +x gradlew
          ./gradlew :plugin:shadowJar :api:sourceJar :api:javadocJar --no-daemon

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/build/libs/Guardian.jar
            api/build/libs/*-sources.jar
            api/build/libs/*-javadoc.jar